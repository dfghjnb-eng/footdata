<head>
  <!--
    If you are serving your web app in a path other than the root, change the

    The path provided below has to start and end with a slash "/" in order for

  <meta charset="UTF-8">

  <meta name="mobile-web-app-capable" content="yes">

<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Keep the installed PWA fresh. iOS home-screen apps hold onto their cached
    // service worker indefinitely, so a redeploy would otherwise never reach the
    // phone. Check for an update on every launch, activate it immediately, and
    // reload once when the new worker takes over.
    if ('serviceWorker' in navigator) {
      var reloadedForUpdate = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (reloadedForUpdate) return;
        reloadedForUpdate = true;
        window.location.reload();
      });
      navigator.serviceWorker.ready.then(function (reg) {
        function activate(worker) {
          if (worker) worker.postMessage('skipWaiting');
        }
        activate(reg.waiting);
        reg.addEventListener('updatefound', function () {
          var installing = reg.installing;
          if (!installing) return;
          installing.addEventListener('statechange', function () {
            if (installing.state === 'installed' &&
                navigator.serviceWorker.controller) {
              activate(installing);
            }
          });
        });
        reg.update();
      }).catch(function () {});
    }
  </script>
</body>
</html>
